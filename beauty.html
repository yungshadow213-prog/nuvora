<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow">
<meta name="description" content="Thoughtful skincare and beauty finds, with detailed product guidance from Nuvora Skin.">
<title>Nuvora Skin — The Everyday Skin Edit</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f7f4ee}#nuvora-skin-store{display:block;width:100%;height:100%;height:100dvh;border:0;background:#f7f4ee}#store-loading{position:fixed;inset:0;display:grid;place-items:center;background:#f7f4ee;color:#66745f;font:500 13px/1.5 system-ui,sans-serif;letter-spacing:.04em;z-index:2}#store-loading[hidden]{display:none}
</style>
</head>
<body>
<div id="store-loading" role="status">Opening the Nuvora Skin store…</div>
<iframe id="nuvora-skin-store" title="Nuvora Skin store" loading="eager"></iframe>
<script>
(function(){
  const CLIENT_ORIGIN='https://client-store-platform.rayyung713.workers.dev';
  const frame=document.getElementById('nuvora-skin-store');
  const loading=document.getElementById('store-loading');
  const basePath='/beauty';
  function routeFromLocation(){
    const path=window.location.pathname;
    let route=path.startsWith(basePath)?path.slice(basePath.length):'/';
    if(!route||route==='/')route='/';
    if(!route.startsWith('/'))route='/'+route;
    return route+window.location.search+window.location.hash;
  }
  function clientUrl(route){
    const parsed=new URL(route,CLIENT_ORIGIN);
    const params=new URLSearchParams(parsed.search);
    params.set('embed','nuvora');
    return CLIENT_ORIGIN+parsed.pathname+'?'+params.toString()+parsed.hash;
  }
  function mainUrl(route){
    const parsed=new URL(route,CLIENT_ORIGIN);
    const path=parsed.pathname==='/'?basePath:basePath+parsed.pathname;
    return path+parsed.search+parsed.hash;
  }
  frame.addEventListener('load',()=>{loading.hidden=true;frame.contentWindow?.postMessage({type:'nuvora-skin-store-navigate',path:routeFromLocation()},CLIENT_ORIGIN);});
  window.addEventListener('message',event=>{
    if(event.origin!==CLIENT_ORIGIN||event.source!==frame.contentWindow)return;
    const data=event.data||{};
    if(data.type==='nuvora-skin-store-ready'){loading.hidden=true;return;}
    if(data.type!=='nuvora-skin-store-route'||typeof data.path!=='string')return;
    const next=mainUrl(data.path),current=window.location.pathname+window.location.search+window.location.hash;
    if(next!==current)window.history.pushState({},'',next);
  });
  window.addEventListener('popstate',()=>frame.contentWindow?.postMessage({type:'nuvora-skin-store-navigate',path:routeFromLocation()},CLIENT_ORIGIN));
  frame.src=clientUrl(routeFromLocation());
})();
</script>
</body>
</html>
