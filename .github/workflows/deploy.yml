name: Deploy Nuvora to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: nuvora-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Check Worker syntax
        run: node --check worker.js

      - name: Check Wrangler production bundle
        run: npx wrangler@4.145.0 deploy --dry-run --outdir /tmp/nuvora-dist

      - name: Check storefront scripts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          failures=[]
          for name in ["index.html","admin.html","edit-product.html"]:
              html=Path(name).read_text(encoding="utf-8")
              scripts=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>",html,re.I)
              for i,src in enumerate([x for x in scripts if x.strip()],1):
                  p=Path("/tmp")/f"nuvora-{name}-{i}.js"
                  p.write_text(src,encoding="utf-8")
                  result=subprocess.run(["node","--check",str(p)],capture_output=True,text=True)
                  if result.returncode:
                      failures.append(f"{name} script {i}: {result.stderr.strip()}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("Storefront/admin/editor JavaScript checks passed.")
          PY

      - name: Check Cloudflare deployment credentials
        id: cloudflare-creds
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.cloudflare-creds.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.145.0 deploy

      - name: Explain deployment handoff
        if: steps.cloudflare-creds.outputs.configured != 'true'
        shell: bash
        run: |
          echo "::notice::GitHub Actions validated Nuvora but did not deploy because Cloudflare credentials are not configured as repository secrets."
          {
            echo "## Deployment handoff"
            echo "Worker syntax, asset bundling, and UI script checks passed."
            echo "This workflow did not deploy because CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not configured."
            echo "If Cloudflare Workers Builds is connected to the main branch, it should deploy independently. Verify the Active Deployment in Cloudflare before treating the live site as updated."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read expected release fingerprint
        id: expected-release
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          source=pathlib.Path("worker.js").read_text(encoding="utf-8")
          match=re.search(r"\brelease\s*:\s*['\"]([^'\"]+)['\"]", source)
          if not match:
              raise SystemExit("worker.js is missing its release fingerprint.")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as output:
              output.write("value="+match.group(1)+"\n")
          print("Expected release: "+match.group(1))
          PY

      - name: Smoke test active production release
        if: steps.cloudflare-creds.outcome == 'success'
        env:
          NUVORA_URL: https://nuvora.rayyung713.workers.dev
          EXPECTED_RELEASE: ${{ steps.expected-release.outputs.value }}
        run: |
          python - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request
          base=os.environ["NUVORA_URL"].rstrip("/")
          expected=os.environ["EXPECTED_RELEASE"]
          health=None
          last_error="no response"
          # Cloudflare Workers Builds may deploy in parallel with this GitHub run.
          # Keep checking for up to three minutes, but never mark an older release green.
          for attempt in range(90):
              try:
                  headers={
                      "User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Safari/537.36",
                      "Accept":"application/json,text/html,application/xhtml+xml,*/*;q=0.8",
                      "Accept-Language":"en-US,en;q=0.9",
                      "Cache-Control":"no-cache",
                      "Pragma":"no-cache"
                  }
                  req=urllib.request.Request(base+"/api/health",headers=headers)
                  with urllib.request.urlopen(req,timeout=15) as response:
                      health=json.load(response)
                  actual=str(health.get("release") or "")
                  if health.get("ok") and actual==expected:
                      print(f"Live release confirmed: {actual}")
                      break
                  last_error=f"live release was {actual or 'missing'}, expected {expected}"
              except urllib.error.HTTPError as e:
                  response_body=e.read(500).decode("utf-8","replace").replace("\\n"," ")[:300]
                  detail=f"HTTP {e.code} {e.reason}; server={e.headers.get('server','unknown')}; cf-ray={e.headers.get('cf-ray','missing')}; body={response_body!r}"
                  if e.code in (401,403):
                      raise SystemExit("Production health endpoint denied the smoke-test request: "+detail+". The active release remains unverified.")
                  last_error=detail
              except Exception as e:
                  last_error=str(e)
              if attempt<89:
                  time.sleep(2)
          else:
              raise SystemExit("Production deployment verification failed: "+last_error+". No claim of live fix should be made until Cloudflare's Active Deployment matches the current main release.")

          for path in ["/api/config","/"]:
              req=urllib.request.Request(base+path,headers={"Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=20) as response:
                  body=response.read().decode("utf-8","replace")
                  if response.status!=200:
                      raise SystemExit(f"{path} returned HTTP {response.status}")
                  if path.startswith("/api/") and not body:
                      raise SystemExit(f"{path} returned an empty response")
                  print(f"{path}: {response.status}")
          print("Production release smoke test passed.")
          PY
