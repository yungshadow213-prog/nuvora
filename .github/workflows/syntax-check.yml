name: Nuvora syntax check

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

jobs:
  node-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Worker syntax
        run: node --check worker.js
      - name: Check multi-storefront router syntax
        run: node --check worker-router.js
      - name: Check Node API server syntax
        run: node --check api/server.js
      - name: Check Cloudflare Wrangler bundle
        run: npx wrangler@4.145.0 deploy --dry-run --outdir /tmp/nuvora-dist



  storefront-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check inline storefront JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          total=0
          for name in ["index.html","beauty.html","multi-store-studio.html","storefront-studio.html"]:
              html=Path(name).read_text(encoding="utf-8")
              scripts=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, flags=re.I)
              inline=[s for s in scripts if s.strip()]
              if not inline:
                  raise SystemExit(f"No inline scripts found in {name}")
              for i,src in enumerate(inline,1):
                  Path(f"/tmp/nuvora-{Path(name).stem}-{i}.js").write_text(src,encoding="utf-8")
              total+=len(inline)
              print(f"{name}: extracted {len(inline)} inline script block(s).")
          print(f"Extracted {total} storefront script block(s).")
          PY
          for file in /tmp/nuvora-index-*.js /tmp/nuvora-beauty-*.js /tmp/nuvora-multi-store-studio-*.js /tmp/nuvora-storefront-studio-*.js; do
            node --check "$file"
          done


  deep-runtime-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit HTML and JavaScript wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          failures=[]
          for name in ["index.html","beauty.html","admin.html","edit-product.html","multi-store-studio.html","storefront-studio.html"]:
              text=Path(name).read_text(encoding="utf-8")
              if len(re.findall(r"<script\b", text, re.I)) != len(re.findall(r"</script>", text, re.I)):
                  failures.append(f"{name}: script tag count mismatch")
              if re.search(r"https?://localhost(?::\d+)?", text, re.I):
                  failures.append(f"{name}: localhost URL reference found")
          worker=Path("worker.js").read_text(encoding="utf-8")
          schema=Path("backend/schema.sql").read_text(encoding="utf-8")
          migration=Path("backend/migrations/2026-10-25-nuvora-product-type.sql")
          if not re.search(r"product_type\s+text", schema):
              failures.append("backend/schema.sql must define products.product_type for Skin Studio")
          if not migration.exists() or "add column if not exists product_type text" not in migration.read_text(encoding="utf-8").lower():
              failures.append("Skin Studio product_type migration must exist and be idempotent")
          if "'product_size','product_type','benefits'" not in worker:
              failures.append("worker.js optional-column compatibility must include product_type")
          router=Path("worker-router.js").read_text(encoding="utf-8")
          if "(games|home|clothing)-storefront" not in router:
              failures.append("worker-router.js: one or more isolated storefront endpoints are missing")
          # Keep each specialist storefront bound to its own settings and product
          # catalogue, and never leak unpublished catalogue rows through public APIs.
          store_contracts = {
              "games": ("games_site_config", "games_products"),
              "home": ("home_site_config", "home_products"),
              "clothing": ("clothing_site_config", "clothing_products"),
          }
          for store_key, (config_key, products_key) in store_contracts.items():
              if f'{store_key}: {{ config: "{config_key}", products: "{products_key}" }}' not in router:
                  failures.append(f"worker-router.js: {store_key} storefront mapping is missing or crossed")
          if "request.method !== \"GET\"" not in router:
              failures.append("worker-router.js: public storefront endpoint must be read-only")
          if 'p.status === "published"' not in router:
              failures.append("worker-router.js: public storefront endpoint must exclude unpublished products")
          if "store.config" not in router or "store.products" not in router:
              failures.append("worker-router.js: public response must use the selected store's isolated config and catalogue")
          if re.search(r"async\s+async\s+function", worker):
              failures.append("worker.js: malformed duplicated async function declaration")
          required_helpers=["configured","randHex","buildProductOptions","getAmazonToken","amazonGetItem","shopifyGraphql","makeProductSlug","validateProduct","supabaseRest","adminUser"]
          for helper in required_helpers:
              if not re.search(r"(?:async\s+)?function\s+"+re.escape(helper)+r"\s*\(", worker):
                  failures.append(f"worker.js: required runtime helper missing: {helper}")
          products_start=worker.find("if(url.pathname==='/api/products'&&request.method==='GET')")
          products_end=worker.find("async function supabaseProductWrite",products_start)
          if products_start>=0 and products_end>products_start:
              public_block=worker[products_start:products_end]
              if "...source" in public_block:
                  failures.append("worker.js: public /api/products response must not spread private product rows")
          if "if (url.pathname === '/api/health')" in worker and "configured(env)" not in worker:
              failures.append("worker.js: health route does not use configured(env)")
          studio=Path("storefront-studio.html").read_text(encoding="utf-8")
          for route_token in ["storefrontStudioRoute","publicStorefrontMatch","adminStorefrontMatch","validateMultiStorefrontConfig","validateMultiStorefrontProducts"]:
              if route_token not in worker:
                  failures.append("worker.js: multi-storefront integration missing "+route_token)
          for studio_token in ["/api/admin/storefronts/","save-draft","publish","uploadProductImages","product-images","eventPrefix:\"nuvora-home-studio\"","eventPrefix:\"nuvora-clothing-studio\"","eventPrefix:\"nuvora-games-studio\""]:
              if studio_token not in studio:
                  failures.append("storefront-studio.html: missing integration contract "+studio_token)
          admin_html = Path("admin.html").read_text(encoding="utf-8")
          if "Other Storefronts" not in admin_html:
              failures.append("admin.html: multi-storefront studio navigation missing")
          # Regression guard for the Skin Care redesign: it is an information-architecture
          # change as well as a visual theme, and the full-page editor remains in the admin.
          for ui_token in [
              'aria-label="Primary navigation"',
              'class="nav-group nav-group-stores"',
              'class="nav-group nav-group-system"',
              'Your storefronts',
              'Import products',
              'id="nuvora-skin-care-redesign-2026"',
              'id="nuvora-admin-structure-redesign"',
              'id="nuvora-admin-modal-catalog-polish"',
              'id="nuvora-admin-contrast-pass"',
              'class="skin-site-builder studio-shell"'
          ]:
              if ui_token not in admin_html:
                  failures.append("admin.html: Skin Care redesign contract missing " + ui_token)
          if 'product_selection:type==="product-grid"?"manual":undefined' not in studio:
              failures.append("storefront-studio.html: newly created product grids must use explicit manual selection")
          for persistence_token in ["function stableJson(value)","stableJson(readback.draft)!==stableJson(result.draft)","stableJson({config:readback.config,products:readback.products})","Save not confirmed"]:
              if persistence_token not in studio:
                  failures.append("storefront-studio.html: draft/publish read-back verification missing "+persistence_token)
          for draft_token in ["const hasDraftProducts=products.some","const draft=hasDraftProducts?{config:publishedConfig,products}:null","[draftColumn]:draft","products:publishedProducts,draft"]:
              if draft_token not in worker:
                  failures.append("worker.js: publishing must preserve private draft products "+draft_token)
          public_block=worker[worker.index("const publicStorefrontMatch"):worker.index("const adminStorefrontMatch")]
          if ".filter(product=>String(product?.status||'published').toLowerCase()==='published')" not in public_block:
              failures.append("worker.js: public storefront endpoint must filter private draft products at read time")
          if "stableJson(readback.draft??null)!==stableJson(result.draft??null)" not in studio:
              failures.append("storefront-studio.html: publish verification must confirm private draft retention")
          if "products=result.draft?.products||result.products||products" not in studio:
              failures.append("storefront-studio.html: editor must retain private draft products after publish")
          migration=Path("backend/migrations/20261025181320_nuvora_multi_storefront_studios.sql").read_text(encoding="utf-8")
          for column in ["home_site_config","home_site_draft","home_products","clothing_site_config","clothing_site_draft","clothing_products","games_site_config","games_site_draft","games_products"]:
              if column not in migration:
                  failures.append("multi-storefront migration missing "+column)
          admin=Path("admin.html").read_text(encoding="utf-8")
          if re.search(r"function\s+togglePublish\s*\([^)]*\)\s*\{[^}]*await", admin, re.S):
              failures.append("admin.html: await inside non-async togglePublish")
          route_methods=re.findall(r"""url\.pathname\s*===\s*['"]([^'"]+)['"][^\n]{0,180}request\.method\s*===\s*['"]([A-Z]+)['"]""", worker)
          route_keys=[p+" "+m for p,m in route_methods]
          if len(route_keys)!=len(set(route_keys)):
              failures.append("worker.js: duplicate exact pathname+method handlers detected")
          for required in ["/api/health","/api/config","/api/settings"]:
              if required not in worker:
                  failures.append(f"worker.js: missing required endpoint {required}")
          studio=Path("storefront-studio.html").read_text(encoding="utf-8")
          if re.search(r'postMessage\([\s\S]{0,350}?,\s*["\']\*["\']\s*\)', studio):
              failures.append("storefront-studio.html: preview messages must target the selected storefront origin, not wildcard")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("Deep runtime audit checks passed.")
          PY


  wrangler-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install project dependencies
        run: npm install
      - name: Wrangler production bundle dry run
        run: npx wrangler deploy --dry-run --outdir /tmp/nuvora-wrangler-dist

  admin-editor-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check inline admin and editor JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ["admin.html","edit-product.html","storefront-studio.html"]:
              html=Path(name).read_text(encoding="utf-8")
              scripts=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, flags=re.I)
              inline=[s for s in scripts if s.strip()]
              if not inline:
                  raise SystemExit(f"No inline scripts found in {name}")
              for i,src in enumerate(inline,1):
                  Path(f"/tmp/nuvora-{name}-{i}.js").write_text(src,encoding="utf-8")
              print(f"{name}: extracted {len(inline)} inline script block(s).")
          PY
          for file in /tmp/nuvora-admin.html-*.js /tmp/nuvora-edit-product.html-*.js /tmp/nuvora-storefront-studio.html-*.js; do
            node --check "$file"
          done

  release-contract-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify critical Nuvora contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          worker=Path("worker.js").read_text(encoding="utf-8")
          admin=Path("admin.html").read_text(encoding="utf-8")
          editor=Path("edit-product.html").read_text(encoding="utf-8")
          beauty=Path("beauty.html").read_text(encoding="utf-8")
          failures=[]
          forbidden=[
              r"async\s+async\s+function",
              r"re\.replace\(/\\b\(\[A-Za-z\]\)\\s\+",
          ]
          for pat in forbidden:
              if re.search(pat,worker):
                  failures.append("worker.js contains a forbidden regression pattern: "+pat)
          for helper in ["configured","isValidHttpUrl","validURL","asinFromUrl","ingestSourceProduct","normalizeAmazonListing","makeProductSlug","validateProduct","supabaseProductWrite"]:
              if not re.search(r"(?:async\s+)?function\s+"+re.escape(helper)+r"\s*\(",worker):
                  failures.append("worker.js missing "+helper)
          for route in ["/api/config","/api/health","/api/admin/products","/api/admin/import/bulk","/api/admin/import/amazon-search","/api/admin/diagnostics","/api/admin/settings","/api/amazon/prepare"]:
              if route not in worker:
                  failures.append("worker.js missing "+route)
          # Schema diagnostic state is owned by the Worker and returned as JSON;
          # it must not be declared as an accidental browser global.
          if "missingProductColumns:[]" not in worker:
              failures.append("worker.js diagnostics missing safe missingProductColumns state")
          if "productSchemaError:''" not in worker:
              failures.append("worker.js diagnostics missing safe productSchemaError state")
          if "missingProductColumns:diagnosticsState.missingProductColumns||[]" not in worker or "productSchemaError:diagnosticsState.productSchemaError||''" not in worker:
              failures.append("worker.js diagnostics must return defensive schema state aliases")
          if "checks.productSchema=schema.core===true;" not in worker:
              failures.append("worker.js optional product columns must not fail core product schema health")
          if "?select=id,published,slug,destination_url,updated_at&id=eq." not in worker:
              failures.append("worker.js publish verification must not depend on optional source columns")
          if "Array.isArray(j?.missingProductColumns)" not in admin:
              failures.append("admin.html must safely read missingProductColumns from diagnostics")
          if "window.__nuvoraSchemaState=window.__nuvoraSchemaState||{missingProductColumns:[],productSchemaError:''}" not in admin:
              failures.append("admin.html missing safe schema-state fallback")
          # The main admin repo now delegates the actual Skin Care storefront to the
          # separate client repo. Do not pretend the wrapper contains the product UI;
          # validate the bridge here and keep detailed UI contracts for legacy/full pages.
          if 'id="nuvora-skin-store"' in beauty:
              if "client-store-platform.rayyung713.workers.dev" not in beauty or "event.origin!==CLIENT_ORIGIN" not in beauty:
                  failures.append("beauty.html: Skin Care storefront wrapper must use the client origin and validate message origin")
              if "nuvora-skin-store-route" not in beauty or "nuvora-skin-store-navigate" not in beauty:
                  failures.append("beauty.html: Skin Care wrapper must preserve storefront route synchronization")
          else:
              # Legacy standalone Skin Care markup, if restored in this repo, must
              # preserve the intentionally minimal overview and detailed product guide.
              card_start = beauty.find("function renderProductCard(p)")
              card_end = beauty.find("function filteredProducts(section)", card_start)
              card_block = beauty[card_start:card_end] if card_start >= 0 and card_end > card_start else ""
              if not card_block or "product-overview-meta" not in card_block or "retailerRatingMarkup(p)" not in card_block or "productAvailabilityMarkup(p)" not in card_block:
                  failures.append("beauty.html: product overview must show rating and known availability with the minimal card layout")
              if "productButtonLabel" in card_block or "priceButton" in card_block:
                  failures.append("beauty.html: retailer purchase button must remain inside the product guide, not on overview cards")
              guide_start = beauty.find("function openProductDetails(id)")
              guide_end = beauty.find("function closeProductDetails()", guide_start)
              guide_block = beauty[guide_start:guide_end] if guide_start >= 0 and guide_end > guide_start else ""
              for guide_heading in ["Key benefits", "Suitable skin types", "Skin concerns", "Key ingredients", "How to use", "Compatibility cautions", "Warnings & precautions", "Consider alongside"]:
                  if guide_heading not in guide_block:
                      failures.append("beauty.html: product guide is missing the expected section: " + guide_heading)
              if "productGalleryImages(p)" not in guide_block or "productButtonLabel(p)" not in guide_block:
                  failures.append("beauty.html: product guide must provide the image gallery and retailer link")
              rating_start = beauty.find("function retailerRatingMarkup")
              rating_end = beauty.find("function productAvailabilityMarkup", rating_start)
              rating_block = beauty[rating_start:rating_end] if rating_start >= 0 and rating_end > rating_start else ""
              if "esc(retailer)+' rating</small>" not in rating_block or "nuvora reviews" in rating_block.lower():
                  failures.append("beauty.html: retailer rating must remain distinguishable from Nuvora customer reviews")
          if "async function togglePublish" not in admin:
              failures.append("admin.html missing publish toggle handler")
          # Skin Studio persistence and preview regression contracts. These guard
          # the fragile draft/save/preview workflow without a production admin session.
          skin_contracts = [
              ("async function persistSkinSiteDraft", "Skin Studio draft persistence helper missing"),
              ("async function saveSkinSiteDraft", "Skin Studio Save Draft handler missing"),
              ("async function saveSkinSiteConfig", "Skin Studio Publish handler missing"),
              ("function addSkinProductToSection", "Skin Studio Place on Page handler missing"),
              ("async function saveSkinProductAndPublish(){\n if(window.productSaveInProgress){", "Save & Publish must not leave a stale publish flag during an active save"),
              ("async function openSkinProduct(){\n try{", "Skin Studio Add Product must handle initialization errors visibly"),
              ("Could not open the skincare product form:", "Skin Studio Add Product failure must provide an actionable status message"),
              ("Wait for it to finish, then choose Save & publish again.", "Concurrent product saves must show a clear retry instruction"),
              ("async function uploadSkinStudioImage", "Skin Studio image upload handler missing"),
              ("function sendSkinStudioPreview", "Skin Studio live-preview bridge missing"),
              ("skin_site_draft:payload", "Skin Studio draft writes must use the private draft setting"),
              ("Your published storefront is unchanged", "Skin Studio save failures must explicitly protect the published storefront"),
              ("saved draft could not be read back", "Skin Studio draft saves must verify saved state by reading it back"),
              ("frame.contentWindow.postMessage({type:'nuvora-skin-studio-preview',config:skinBuilderConfig,products:previewProducts},SKIN_CLIENT_ORIGIN)", "Skin Studio preview must use the configured client origin"),
          ]
          for needle, message in skin_contracts:
              if needle not in admin:
                  failures.append(message)
          # Skin Studio preview lifecycle and canvas-first workspace regression contracts.
          preview_wire_start=admin.find("function wireSkinStudioCanvas()")
          preview_wire_end=admin.find("if(!window.__nuvoraSkinStudioBridgeWired)",preview_wire_start)
          preview_wire_block=admin[preview_wire_start:preview_wire_end]
          if "if(window.__nuvoraSkinPreviewReady)" not in preview_wire_block:
              failures.append("Skin Studio iframe load must preserve an early ready handshake")
          if "if(window.__nuvoraSkinPreviewReady)return" not in preview_wire_block:
              failures.append("Skin Studio preview timeout must not overwrite a ready preview")
          if "window.__nuvoraSkinPreviewReady=true" not in admin:
              failures.append("Skin Studio ready messages must record the handshake")
          reload_preview_start=admin.find("function reloadSkinStudioPreview")
          reload_preview_end=admin.find("function refreshSkinStudioPreview",reload_preview_start)
          reload_preview_block=admin[reload_preview_start:reload_preview_end]
          if "window.__nuvoraSkinPreviewReady=false" not in reload_preview_block or "clearTimeout(window.__nuvoraSkinPreviewTimeout)" not in reload_preview_block:
              failures.append("Skin Studio preview reload must reset the ready flag and cancel stale timeouts")
          for workspace_token in ["toggleSkinStudioPanel('outline',this)","toggleSkinStudioPanel('inspector',this)","toggleSkinStudioFocus(this)","skin-studio-hide-outline","skin-studio-hide-inspector"]:
              if workspace_token not in admin:
                  failures.append("Skin Studio canvas controls missing "+workspace_token)
          for history_token in ["function skinHistoryCapture()","function undoSkinStudio()","function redoSkinStudio()","skinStudioUndo","skinStudioRedo","event.key.toLowerCase()==='z'","event.key.toLowerCase()==='y'"]:
              if history_token not in admin:
                  failures.append("Skin Studio undo/redo history contract missing "+history_token)
          for library_token in ["const pageSize=10","setSkinStudioProductFilter","skinStudioProductAvailability","Filter products by brand","Filter products by category","Filter products by publication status"]:
              if library_token not in admin:
                  failures.append("Skin Studio product library control missing "+library_token)
          for media_token in ["function renderSkinMediaLibrary(root,forceRefresh=false)","function paintSkinStudioMediaLibrary(root)","function useSkinStudioMedia(url)","function setSkinStudioMediaPage(page)","const pageSize=24","skinTabMedia","product-images').list('skin-site'"]:
              if media_token not in admin:
                  failures.append("Skin Studio media library contract missing "+media_token)
          for publish_token in ["function skinStudioPublishWarnings()","Draft products will not be visible to public shoppers","Continue publishing anyway?"]:
              if publish_token not in admin:
                  failures.append("Skin Studio publish preflight contract missing "+publish_token)
          for recovery_token in ["function skinStudioRecoveryStorageKey()","function writeSkinStudioRecovery()","function restoreSkinStudioRecoveryIfAvailable()","Recovered unsaved edits","clearSkinStudioRecovery()","sessionStorage.setItem(skinStudioRecoveryStorageKey()"]:
              if recovery_token not in admin:
                  failures.append("Skin Studio local recovery contract missing "+recovery_token)
          if "document.addEventListener('focusin',event=>" not in admin or "document.addEventListener('input',event=>" in admin[admin.find("function skinHistoryCapture"):admin.find("function renderSkinStudioAll")]:
              failures.append("Skin Studio history must capture pre-edit state, not post-input state")
          visibility_start=admin.find("function toggleSkinSectionVisibility(index){")
          visibility_end=admin.find("function skinBuilderDragStart",visibility_start)
          visibility_block=admin[visibility_start:visibility_end]
          visibility_history=visibility_block.find("skinHistoryCapture()")
          visibility_mutation=visibility_block.find("sec.visible=")
          if visibility_history < 0 or visibility_mutation < 0 or visibility_history > visibility_mutation:
              failures.append("Section visibility must capture history before changing visibility")
          selection_start=admin.find("function toggleSkinSectionProduct(index,productId,checked){")
          selection_end=admin.find("function toggleSkinSectionLock",selection_start)
          selection_block=admin[selection_start:selection_end]
          selection_history=selection_block.find("skinHistoryCapture()")
          selection_mutation=selection_block.find("sec.product_selection=")
          if selection_history < 0 or selection_mutation < 0 or selection_history > selection_mutation:
              failures.append("Product selection must capture history before mutating selected IDs")
          reorder_start=admin.find("function skinSectionDrop(event,index){")
          reorder_end=admin.find("function skinSectionDragEnd",reorder_start)
          reorder_block=admin[reorder_start:reorder_end]
          reorder_history=reorder_block.find("skinHistoryCapture()")
          reorder_mutation=reorder_block.find("sections.splice(")
          if reorder_history < 0 or reorder_mutation < 0 or reorder_history > reorder_mutation:
              failures.append("Drag-and-drop reorder must capture history before changing order")
          update_section_start=admin.find("function updateSkinSection(index,key,value,fromPreview=false){")
          update_section_end=admin.find("function selectFirstSkinSection",update_section_start)
          update_section_block=admin[update_section_start:update_section_end]
          if "if(sec.locked)" not in update_section_block or "Unlock it in the page outline before editing its settings." not in update_section_block:
              failures.append("Section settings mutation must enforce the locked-section guard")
          placement_start=admin.find("function addSkinProductToSection")
          placement_end=admin.find("function moveSkinProductInSection",placement_start)
          placement_block=admin[placement_start:placement_end]
          if "candidate.visible!==false" not in placement_block or "s.visible!==false" not in placement_block or "!candidate.locked" not in placement_block:
              failures.append("Place on Page must only target visible, unlocked product sections")
          open_skin_start=admin.find("async function openSkinProduct(){")
          open_skin_end=admin.find("function productReviewFlags",open_skin_start)
          open_skin_block=admin[open_skin_start:open_skin_end]
          if "openProductModal(true);" not in open_skin_block:
              failures.append("Skin Studio Add Product must open the product modal instead of only changing its labels")
          manual_skin_start=admin.find("async function openSkinManualProduct(){")
          manual_skin_end=admin.find("async function editSkinProduct(id)",manual_skin_start)
          manual_skin_block=admin[manual_skin_start:manual_skin_end]
          if "openProductModal(false);" not in manual_skin_block or "productModal').classList.add('open')" not in manual_skin_block:
              failures.append("Skin Studio manual Add Product must reset and visibly open the product form")
          edit_skin_start=admin.find("async function editSkinProduct(id)")
          edit_skin_end=admin.find("function productReviewFlags",edit_skin_start)
          edit_skin_block=admin[edit_skin_start:edit_skin_end]
          if "openProductModal(false);" not in edit_skin_block or "setProductForm(p);" not in edit_skin_block:
              failures.append("Skin Studio Edit Product must open the editor and populate the selected product")
          placement_start=admin.find("function addSkinProductToSection")
          placement_end=admin.find("function moveSkinProductInSection",placement_start)
          placement_block=admin[placement_start:placement_end]
          for needle, message in [
              ("sec.product_selection='manual';sec.product_ids=ids.slice(0,60)", "Place on Page must explicitly persist a manual product selection"),
              ("sendSkinStudioPreview();queueSkinStudioPreview();", "Place on Page must refresh the live preview"),
              ("saveSkinStudioChangeImmediately(", "Place on Page must immediately save and verify the page draft"),
          ]:
              if needle not in placement_block:
                  failures.append(message)
          # Draft preview exposes only products explicitly placed on a visible grid.
          preview_start = admin.find("function sendSkinStudioPreview")
          preview_end = admin.find("function reloadSkinStudioPreview", preview_start)
          preview_block = admin[preview_start:preview_end] if preview_start >= 0 and preview_end > preview_start else ""
          if "placedIds.has(String(product.id))&&isSkinProduct(product)" not in preview_block:
              failures.append("Skin Studio preview must not expose unplaced catalogue products")
          if "publishProductRecord" not in worker or "/api/admin/products/" not in worker or "/publish$/" not in worker:
              failures.append("worker.js missing authoritative product publish route")
          if "function discoverAmazonProducts" not in admin:
              failures.append("admin.html missing Discover 20 handler")
          if "function retailerDestination" not in admin:
              failures.append("admin.html missing retailer destination resolver")
          if "function healthCheck" not in admin:
              failures.append("admin.html missing System Status handler")
          if "async function publish" not in editor:
              failures.append("edit-product.html missing publish handler")
          if "async function save" not in editor:
              failures.append("edit-product.html missing save handler")
          if failures:
              print("\n".join(failures));sys.exit(1)
          print("Critical Nuvora release contracts passed.")
          PY


