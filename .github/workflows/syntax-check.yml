name: Nuvora syntax check

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

jobs:
  node-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Worker syntax
        run: node --check worker.js
      - name: Check multi-storefront router syntax
        run: node --check worker-router.js
      - name: Check Node API server syntax
        run: node --check api/server.js
      - name: Check Cloudflare Wrangler bundle
        run: npx wrangler@4.145.0 deploy --dry-run --outdir /tmp/nuvora-dist



  storefront-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check inline storefront JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          total=0
          for name in ["index.html","beauty.html","multi-store-studio.html"]:
              html=Path(name).read_text(encoding="utf-8")
              scripts=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, flags=re.I)
              inline=[s for s in scripts if s.strip()]
              if not inline:
                  raise SystemExit(f"No inline scripts found in {name}")
              for i,src in enumerate(inline,1):
                  Path(f"/tmp/nuvora-{Path(name).stem}-{i}.js").write_text(src,encoding="utf-8")
              total+=len(inline)
              print(f"{name}: extracted {len(inline)} inline script block(s).")
          print(f"Extracted {total} storefront script block(s).")
          PY
          for file in /tmp/nuvora-index-*.js /tmp/nuvora-beauty-*.js /tmp/nuvora-multi-store-studio-*.js; do
            node --check "$file"
          done


  deep-runtime-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit HTML and JavaScript wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          failures=[]
          for name in ["index.html","beauty.html","admin.html","edit-product.html","multi-store-studio.html"]:
              text=Path(name).read_text(encoding="utf-8")
              if len(re.findall(r"<script\b", text, re.I)) != len(re.findall(r"</script>", text, re.I)):
                  failures.append(f"{name}: script tag count mismatch")
              if re.search(r"https?://localhost(?::\d+)?", text, re.I):
                  failures.append(f"{name}: localhost URL reference found")
          worker=Path("worker.js").read_text(encoding="utf-8")
          router=Path("worker-router.js").read_text(encoding="utf-8")
          if "(games|home|clothing)-storefront" not in router:
              failures.append("worker-router.js: one or more isolated storefront endpoints are missing")
          # Keep each specialist storefront bound to its own settings and product
          # catalogue, and never leak unpublished catalogue rows through public APIs.
          store_contracts = {
              "games": ("games_site_config", "games_products"),
              "home": ("home_site_config", "home_products"),
              "clothing": ("clothing_site_config", "clothing_products"),
          }
          for store_key, (config_key, products_key) in store_contracts.items():
              if f'{store_key}: {{ config: "{config_key}", products: "{products_key}" }}' not in router:
                  failures.append(f"worker-router.js: {store_key} storefront mapping is missing or crossed")
          if "request.method !== \"GET\"" not in router:
              failures.append("worker-router.js: public storefront endpoint must be read-only")
          if 'p.status === "published"' not in router:
              failures.append("worker-router.js: public storefront endpoint must exclude unpublished products")
          if "store.config" not in router or "store.products" not in router:
              failures.append("worker-router.js: public response must use the selected store's isolated config and catalogue")
          if re.search(r"async\s+async\s+function", worker):
              failures.append("worker.js: malformed duplicated async function declaration")
          required_helpers=["configured","randHex","buildProductOptions","getAmazonToken","amazonGetItem","shopifyGraphql","makeProductSlug","validateProduct","supabaseRest","adminUser"]
          for helper in required_helpers:
              if not re.search(r"(?:async\s+)?function\s+"+re.escape(helper)+r"\s*\(", worker):
                  failures.append(f"worker.js: required runtime helper missing: {helper}")
          products_start=worker.find("if(url.pathname==='/api/products'&&request.method==='GET')")
          products_end=worker.find("async function supabaseProductWrite",products_start)
          if products_start>=0 and products_end>products_start:
              public_block=worker[products_start:products_end]
              if "...source" in public_block:
                  failures.append("worker.js: public /api/products response must not spread private product rows")
          if "if (url.pathname === '/api/health')" in worker and "configured(env)" not in worker:
              failures.append("worker.js: health route does not use configured(env)")
          admin=Path("admin.html").read_text(encoding="utf-8")
          if re.search(r"function\s+togglePublish\s*\([^)]*\)\s*\{[^}]*await", admin, re.S):
              failures.append("admin.html: await inside non-async togglePublish")
          route_methods=re.findall(r"""url\.pathname\s*===\s*['"]([^'"]+)['"][^\n]{0,180}request\.method\s*===\s*['"]([A-Z]+)['"]""", worker)
          route_keys=[p+" "+m for p,m in route_methods]
          if len(route_keys)!=len(set(route_keys)):
              failures.append("worker.js: duplicate exact pathname+method handlers detected")
          for required in ["/api/health","/api/config","/api/settings"]:
              if required not in worker:
                  failures.append(f"worker.js: missing required endpoint {required}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("Deep runtime audit checks passed.")
          PY


  wrangler-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install project dependencies
        run: npm install
      - name: Wrangler production bundle dry run
        run: npx wrangler deploy --dry-run --outdir /tmp/nuvora-wrangler-dist

  admin-editor-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check inline admin and editor JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ["admin.html","edit-product.html"]:
              html=Path(name).read_text(encoding="utf-8")
              scripts=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, flags=re.I)
              inline=[s for s in scripts if s.strip()]
              if not inline:
                  raise SystemExit(f"No inline scripts found in {name}")
              for i,src in enumerate(inline,1):
                  Path(f"/tmp/nuvora-{name}-{i}.js").write_text(src,encoding="utf-8")
              print(f"{name}: extracted {len(inline)} inline script block(s).")
          PY
          for file in /tmp/nuvora-admin.html-*.js /tmp/nuvora-edit-product.html-*.js; do
            node --check "$file"
          done

  release-contract-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify critical Nuvora contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          worker=Path("worker.js").read_text(encoding="utf-8")
          admin=Path("admin.html").read_text(encoding="utf-8")
          editor=Path("edit-product.html").read_text(encoding="utf-8")
          beauty=Path("beauty.html").read_text(encoding="utf-8")
          failures=[]
          forbidden=[
              r"async\s+async\s+function",
              r"re\.replace\(/\\b\(\[A-Za-z\]\)\\s\+",
          ]
          for pat in forbidden:
              if re.search(pat,worker):
                  failures.append("worker.js contains a forbidden regression pattern: "+pat)
          for helper in ["configured","isValidHttpUrl","validURL","asinFromUrl","ingestSourceProduct","normalizeAmazonListing","makeProductSlug","validateProduct","supabaseProductWrite"]:
              if not re.search(r"(?:async\s+)?function\s+"+re.escape(helper)+r"\s*\(",worker):
                  failures.append("worker.js missing "+helper)
          for route in ["/api/config","/api/health","/api/admin/products","/api/admin/import/bulk","/api/admin/import/amazon-search","/api/admin/diagnostics","/api/admin/settings","/api/amazon/prepare"]:
              if route not in worker:
                  failures.append("worker.js missing "+route)
          # Schema diagnostic state is owned by the Worker and returned as JSON;
          # it must not be declared as an accidental browser global.
          if "missingProductColumns:[]" not in worker:
              failures.append("worker.js diagnostics missing safe missingProductColumns state")
          if "productSchemaError:''" not in worker:
              failures.append("worker.js diagnostics missing safe productSchemaError state")
          if "missingProductColumns:diagnosticsState.missingProductColumns||[]" not in worker or "productSchemaError:diagnosticsState.productSchemaError||''" not in worker:
              failures.append("worker.js diagnostics must return defensive schema state aliases")
          if "checks.productSchema=schema.core===true;" not in worker:
              failures.append("worker.js optional product columns must not fail core product schema health")
          if "?select=id,published,slug,destination_url,updated_at&id=eq." not in worker:
              failures.append("worker.js publish verification must not depend on optional source columns")
          if "Array.isArray(j?.missingProductColumns)" not in admin:
              failures.append("admin.html must safely read missingProductColumns from diagnostics")
          if "window.__nuvoraSchemaState=window.__nuvoraSchemaState||{missingProductColumns:[],productSchemaError:''}" not in admin:
              failures.append("admin.html missing safe schema-state fallback")
          # The main admin repo now delegates the actual Skin Care storefront to the
          # separate client repo. Do not pretend the wrapper contains the product UI;
          # validate the bridge here and keep detailed UI contracts for legacy/full pages.
          if 'id="nuvora-skin-store"' in beauty:
              if "client-store-platform.rayyung713.workers.dev" not in beauty or "event.origin!==CLIENT_ORIGIN" not in beauty:
                  failures.append("beauty.html: Skin Care storefront wrapper must use the client origin and validate message origin")
              if "nuvora-skin-store-route" not in beauty or "nuvora-skin-store-navigate" not in beauty:
                  failures.append("beauty.html: Skin Care wrapper must preserve storefront route synchronization")
          else:
              # Legacy standalone Skin Care markup, if restored in this repo, must
              # preserve the intentionally minimal overview and detailed product guide.
              card_start = beauty.find("function renderProductCard(p)")
              card_end = beauty.find("function filteredProducts(section)", card_start)
              card_block = beauty[card_start:card_end] if card_start >= 0 and card_end > card_start else ""
              if not card_block or "product-overview-meta" not in card_block or "retailerRatingMarkup(p)" not in card_block or "productAvailabilityMarkup(p)" not in card_block:
                  failures.append("beauty.html: product overview must show rating and known availability with the minimal card layout")
              if "productButtonLabel" in card_block or "priceButton" in card_block:
                  failures.append("beauty.html: retailer purchase button must remain inside the product guide, not on overview cards")
              guide_start = beauty.find("function openProductDetails(id)")
              guide_end = beauty.find("function closeProductDetails()", guide_start)
              guide_block = beauty[guide_start:guide_end] if guide_start >= 0 and guide_end > guide_start else ""
              for guide_heading in ["Key benefits", "Suitable skin types", "Skin concerns", "Key ingredients", "How to use", "Compatibility cautions", "Warnings & precautions", "Consider alongside"]:
                  if guide_heading not in guide_block:
                      failures.append("beauty.html: product guide is missing the expected section: " + guide_heading)
              if "productGalleryImages(p)" not in guide_block or "productButtonLabel(p)" not in guide_block:
                  failures.append("beauty.html: product guide must provide the image gallery and retailer link")
              rating_start = beauty.find("function retailerRatingMarkup")
              rating_end = beauty.find("function productAvailabilityMarkup", rating_start)
              rating_block = beauty[rating_start:rating_end] if rating_start >= 0 and rating_end > rating_start else ""
              if "esc(retailer)+' rating</small>" not in rating_block or "nuvora reviews" in rating_block.lower():
                  failures.append("beauty.html: retailer rating must remain distinguishable from Nuvora customer reviews")
          # Skin Studio writes product_type, so the canonical schema and an idempotent
          # migration must both declare it before the new admin form is integrated.
          schema=Path("backend/schema.sql").read_text(encoding="utf-8")
          migration=Path("backend/migrations/2026-10-25-nuvora-product-type.sql")
          if not re.search(r"product_type\s+text", schema):
              failures.append("backend/schema.sql must define the optional products.product_type column")
          if not migration.exists() or "add column if not exists product_type text" not in migration.read_text(encoding="utf-8").lower():
              failures.append("Skin Studio product_type migration is missing or not idempotent")
          if "async function togglePublish" not in admin:
              failures.append("admin.html missing publish toggle handler")
          # Skin Studio persistence and preview regression contracts. These guard
          # the fragile draft/save/preview workflow without a production admin session.
          skin_contracts = [
              ("async function persistSkinSiteDraft", "Skin Studio draft persistence helper missing"),
              ("async function saveSkinSiteDraft", "Skin Studio Save Draft handler missing"),
              ("async function saveSkinSiteConfig", "Skin Studio Publish handler missing"),
              ("function addSkinProductToSection", "Skin Studio Place on Page handler missing"),
              ("async function uploadSkinStudioImage", "Skin Studio image upload handler missing"),
              ("function sendSkinStudioPreview", "Skin Studio live-preview bridge missing"),
              ("skin_site_draft:payload", "Skin Studio draft writes must use the private draft setting"),
              ("Your published storefront is unchanged", "Skin Studio save failures must explicitly protect the published storefront"),
              ("saved draft could not be read back", "Skin Studio draft saves must verify saved state by reading it back"),
              ("frame.contentWindow.postMessage({type:'nuvora-skin-studio-preview',config:skinBuilderConfig,products:previewProducts},SKIN_CLIENT_ORIGIN)", "Skin Studio preview must use the configured client origin"),
          ]
          for needle, message in skin_contracts:
              if needle not in admin:
                  failures.append(message)
          # Draft preview exposes only products explicitly placed on a visible grid.
          preview_start = admin.find("function sendSkinStudioPreview")
          preview_end = admin.find("function reloadSkinStudioPreview", preview_start)
          preview_block = admin[preview_start:preview_end] if preview_start >= 0 and preview_end > preview_start else ""
          if "placedIds.has(String(product.id))&&isSkinProduct(product)" not in preview_block:
              failures.append("Skin Studio preview must not expose unplaced catalogue products")
          if "publishProductRecord" not in worker or "/api/admin/products/" not in worker or "/publish$/" not in worker:
              failures.append("worker.js missing authoritative product publish route")
          if "function discoverAmazonProducts" not in admin:
              failures.append("admin.html missing Discover 20 handler")
          if "function retailerDestination" not in admin:
              failures.append("admin.html missing retailer destination resolver")
          if "function healthCheck" not in admin:
              failures.append("admin.html missing System Status handler")
          if "async function publish" not in editor:
              failures.append("edit-product.html missing publish handler")
          if "async function save" not in editor:
              failures.append("edit-product.html missing save handler")
          if failures:
              print("\n".join(failures));sys.exit(1)
          print("Critical Nuvora release contracts passed.")
          PY


  wrangler-deploy-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate the real Cloudflare bundle
        run: npx --yes wrangler@4.145.0 deploy --dry-run --outdir /tmp/nuvora-worker-bundle


  cloudflare-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Wrangler bundle
        run: npx wrangler@4.145.0 deploy --dry-run --outdir /tmp/nuvora-dist

  cloudflare-wrangler-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bundle with the same Wrangler version as production
        run: npx --yes wrangler@4.145.0 deploy --dry-run --outdir /tmp/nuvora-wrangler-dist
