name: Nuvora syntax check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  node-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Worker syntax
        run: node --check worker.js
