name: Nuvora syntax check

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

jobs:
  node-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Worker syntax
        run: node --check worker.js


  storefront-javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check inline storefront JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, flags=re.I)
          inline=[s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit("No inline scripts found in index.html")
          for i,src in enumerate(inline,1):
              Path(f"/tmp/nuvora-index-{i}.js").write_text(src,encoding="utf-8")
          print(f"Extracted {len(inline)} inline script block(s).")
          PY
          for file in /tmp/nuvora-index-*.js; do
            node --check "$file"
          done


  deep-runtime-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit HTML and JavaScript wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          failures=[]
          for name in ["index.html","admin.html","edit-product.html"]:
              text=Path(name).read_text(encoding="utf-8")
              if len(re.findall(r"<script\b", text, re.I)) != len(re.findall(r"</script>", text, re.I)):
                  failures.append(f"{name}: script tag count mismatch")
              if re.search(r"https?://localhost(?::\d+)?", text, re.I):
                  failures.append(f"{name}: localhost URL reference found")
          worker=Path("worker.js").read_text(encoding="utf-8")
          if re.search(r"async\\s+async\\s+function", worker):
              failures.append("worker.js: malformed duplicated async function declaration")
          required_helpers=["configured","randHex","buildProductOptions","getAmazonToken","amazonGetItem","shopifyGraphql","makeProductSlug","validateProduct","supabaseRest","adminUser"]
          for helper in required_helpers:
              if not re.search(r"(?:async\\s+)?function\\s+"+re.escape(helper)+r"\\s*\\(", worker):
                  failures.append(f"worker.js: required runtime helper missing: {helper}")
          products_start=worker.find("if(url.pathname==='/api/products'&&request.method==='GET')")
          products_end=worker.find("async function supabaseProductWrite",products_start)
          if products_start>=0 and products_end>products_start:
              public_block=worker[products_start:products_end]
              if "...source" in public_block:
                  failures.append("worker.js: public /api/products response must not spread private product rows")
          if "if (url.pathname === '/api/health')" in worker and "configured(env)" not in worker:
              failures.append("worker.js: health route does not use configured(env)")
          admin=Path("admin.html").read_text(encoding="utf-8")
          if re.search(r"function\s+togglePublish\s*\([^)]*\)\s*\{[^}]*await", admin, re.S):
              failures.append("admin.html: await inside non-async togglePublish")
          route_methods=re.findall(r"""url\.pathname\s*===\s*['"]([^'"]+)['"][^\n]{0,180}request\.method\s*===\s*['"]([A-Z]+)['"]""", worker)
          route_keys=[p+" "+m for p,m in route_methods]
          if len(route_keys)!=len(set(route_keys)):
              failures.append("worker.js: duplicate exact pathname+method handlers detected")
          for required in ["/api/health","/api/config","/api/settings"]:
              if required not in worker:
                  failures.append(f"worker.js: missing required endpoint {required}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("Deep runtime audit checks passed.")
          PY
